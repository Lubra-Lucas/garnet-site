# Publica o protótipo no GitHub Pages a cada push na branch padrão.
# Pré-requisito (uma vez): Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Publicar no GitHub Pages

on:
  push:
    branches: [claude/clever-heisenberg-pv96u6]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Montar a pasta do site
        run: |
          mkdir _site
          cp -r index.html assets _site/
          # protótipo: não deixar o Google indexar no lugar do domínio oficial
          sed -i 's|<meta name="theme-color"|<meta name="robots" content="noindex, nofollow" />\n  <meta name="theme-color"|' _site/index.html
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
